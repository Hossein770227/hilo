<!doctype html>
{% load static %}
{% load i18n %}
<html lang="en" dir="rtl">
    <head>
        <!-- Required Meta Tags -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Bootstrap CSS --> 
        <link rel="stylesheet" href="{% static "assets/css/bootstrap.min.css" %}">
        <!-- Animate Min CSS -->
        <link rel="stylesheet" href="{% static "assets/css/animate.min.css" %}">
        <!-- Flaticon CSS -->
        <link rel="stylesheet" href="{% static "assets/fonts/flaticon.css" %}">
        <!-- Boxicons CSS -->
        <link rel="stylesheet" href="{% static "assets/css/boxicons.min.css" %}">
        <!-- Owl Carousel Min CSS --> 
        <link rel="stylesheet" href="{% static "assets/css/owl.carousel.min.css" %}">
        <link rel="stylesheet" href="{% static "assets/css/owl.theme.default.min.css" %}">
        <!-- Nice Select Min CSS --> 
        <link rel="stylesheet" href="{% static "assets/css/nice-select.min.css" %}">
        <!-- Meanmenu CSS -->
        <link rel="stylesheet" href="{% static "assets/css/meanmenu.css" %}">
        <!-- Style CSS -->
        <link rel="stylesheet" href="{% static "assets/css/style.css" %}">
        <!-- Responsive CSS -->
        <link rel="stylesheet" href="{% static "assets/css/responsive.css" %}">
        <!-- Theme Dark CSS -->
        <link rel="stylesheet" href="{% static "assets/css/theme-dark.css" %}">


        <!-- Favicon -->
        <link rel="icon" type="image/png" href="{% static "assets/images/favicon.png" %}">

        <title>
            {% block page_title %}
            
            {% endblock page_title %}
        </title>
    </head>
    <body>
        {% block navbar %}
          
        {% endblock navbar %}

        {% include "includes/messages.html" %}
        {% block content %}
          
        {% endblock content %}

        {% include "includes/footer.html" %}


       <!-- Jquery Min JS -->
        <script src="{% static "assets/js/jquery.min.js" %}"></script>
        <!-- Bootstrap Min JS -->
        <script src="{% static "assets/js/bootstrap.bundle.min.js" %}"></script>
        <!-- Owl Carousel Min JS -->
        <script src="{% static "assets/js/owl.carousel.min.js" %}"></script>
        <!-- Nice Select Min JS -->
        <script src="{% static "assets/js/jquery.nice-select.min.js" %}"></script>
        <!-- Wow Min JS -->
        <script src="{% static "assets/js/wow.min.js" %}"></script>
        <!-- Meanmenu JS -->
        <script src="{% static "assets/js/meanmenu.js" %}"></script>
        <!-- Jquery Ui Min JS -->
        <script src="{% static "assets/js/jquery-ui.min.js" %}"></script>
        <!-- Ajaxchimp Min JS -->
        <script src="{% static "assets/js/jquery.ajaxchimp.min.js" %}"></script>
        <!-- Form Validator Min JS -->
        <script src="{% static "assets/js/form-validator.min.js" %}"></script>
        <!-- Contact Form JS -->
        <script src="{% static "assets/js/contact-form-script.js" %}"></script>
        <!-- Mixitup Min JS -->
        <script src="{% static "assets/js/mixitup.min.js" %}"></script>
        <!-- Custom JS -->
        <script src="{% static "assets/js/custom.js" %}"></script>

    </body>
</html>
